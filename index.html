<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="MatSkrin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171315" media="(prefers-color-scheme: dark)" />
    <title>MatSkrin</title>
    <script>
      // Pasang tema sebelum halaman digambar agar tidak berkedip. Tanpa pilihan tersimpan, ikuti sistem.
      (function () {
        var t = null
        try { t = localStorage.getItem('matskrin:tema') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
